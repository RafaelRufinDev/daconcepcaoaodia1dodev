services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurora_dev
      POSTGRES_PASSWORD: aurora_dev_password
      POSTGRES_DB: aurora_core_db
    ports:
      - '5432:5432'
    volumes:
      - aurora_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurora_dev -d aurora_core_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurora_core_data:
